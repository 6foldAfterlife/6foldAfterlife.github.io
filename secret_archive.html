<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私密存档 - 验证成功</title>
    <!-- 引入 Tailwind CSS 保持统一样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8b1d1d', // 古风暗红色
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', '"Songti SC"', 'STSong', 'serif'],
                        sans: ['"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f5f5f4; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased selection:bg-primary selection:text-white flex flex-col justify-center items-center min-h-screen p-4 sm:p-0">

    <!-- 主容器 -->
    <main class="w-full max-w-3xl bg-white sm:rounded-xl shadow-sm sm:shadow-md overflow-hidden relative">
        
        <!-- 头部区域 -->
        <header class="pt-16 pb-10 px-8 sm:px-12 border-b border-stone-100 text-center relative overflow-hidden">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-primary opacity-80 rounded-b-md"></div>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-stone-900 tracking-widest mb-4">验证成功</h1>
            <p class="text-base text-stone-400 tracking-wider font-serif">
                欢迎来到私密存档
            </p>
        </header>

        <!-- 内容区域 -->
        <article class="p-8 sm:p-16 flex flex-col items-center text-center">
            
            <div class="w-full max-w-md p-8 bg-stone-50 border border-stone-200 rounded-xl shadow-sm">
                <!-- 装饰性小图标 -->
                <div class="w-12 h-12 bg-red-50 text-primary rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                
                <h2 class="text-xl font-bold text-stone-800 mb-3 font-serif">恭喜中奖</h2>
                <p class="text-stone-500 mb-8 font-serif leading-relaxed text-sm sm:text-base">
                    请点击下方按钮，前往腾讯文档填写您的邮寄信息。赠品（88小像钥匙扣+廉亲王不想上班留言板）还在制作中，4月下旬-5月初会陆续发货~
                </p>
                
                <!-- 重点：表单链接按钮 -->
                <a href="https://docs.qq.com/form/page/DZHZ5dnRka0NRREhI" target="_blank" rel="noopener noreferrer" class="block w-full bg-primary text-white py-3 px-6 rounded-md hover:bg-[#6a1515] transition-all duration-300 shadow-sm font-medium font-serif tracking-widest text-lg hover:shadow-md transform hover:-translate-y-0.5">
                    前往填写表单
                </a>
                
                <p class="text-xs text-stone-400 mt-4">
                    （链接将在新标签页中打开）
                </p>
            </div>

            <!-- 返回主页按钮 -->
            <div class="mt-12">
                <a href="index.html" class="inline-flex items-center gap-2 text-stone-400 hover:text-primary transition-colors font-serif border-b border-transparent hover:border-primary pb-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    返回主页
                </a>
            </div>

        </article>

        <!-- 底部页脚 -->
        <footer class="bg-stone-50 py-6 border-t border-stone-200 text-center">
            <p class="text-stone-400 text-base font-serif">© 文档存稿</p>
        </footer>

    </main>

</body>
</html>
